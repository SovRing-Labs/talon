<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Talon Console</title>
<style>
/* Tokens follow the Sov Raptor launcher (projects/opencode-launcher/ui/src/app.css): dark-first,
   living cyan. System fonts only: this page must work with no network. */
:root {
  color-scheme: dark;
  --bg: #080D12; --panel: #0C141B; --raise: #151B23; --line: #1f2a33; --line-soft: rgba(255,255,255,.06);
  --fg: #e6e8ee; --dim: #9aa3b2; --mute: #6b7384;
  --life: #5EE2D6; --life-deep: #1B8F8A; --life-a: rgba(94,226,214,.13);
  --ok: #10B981; --warn: #F59E0B; --err: #e15a6a; --violet: #7c5cff;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  --mono: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, monospace;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    color-scheme: light;
    --bg: #f4f7f8; --panel: #ffffff; --raise: #eef3f4; --line: #d6e0e3; --line-soft: rgba(0,0,0,.06);
    --fg: #14202a; --dim: #4c5a66; --mute: #7a8792; --life: #0f8a82; --life-deep: #0b6d67; --life-a: rgba(15,138,130,.10);
  }
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #f4f7f8; --panel: #ffffff; --raise: #eef3f4; --line: #d6e0e3; --line-soft: rgba(0,0,0,.06);
  --fg: #14202a; --dim: #4c5a66; --mute: #7a8792; --life: #0f8a82; --life-deep: #0b6d67; --life-a: rgba(15,138,130,.10);
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--fg); font: 14px/1.5 var(--sans); display: grid; grid-template-columns: 300px 1fr; }
button, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--life); outline-offset: 2px; }

aside { border-right: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
.brand { display: flex; align-items: baseline; gap: 8px; padding: 16px 16px 12px; border-bottom: 1px solid var(--line); }
.brand b { font-size: 16px; letter-spacing: .02em; }
.brand span { color: var(--mute); font-size: 12px; }
.brand .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--mute); align-self: center; }
.brand .dot.up { background: var(--life); box-shadow: 0 0 10px var(--life); }
.newbtn { margin: 12px 16px; padding: 8px 12px; border: 1px solid var(--life-deep); background: var(--life-a); border-radius: 8px; cursor: pointer; text-align: left; }
.newbtn:hover { border-color: var(--life); }
#list { overflow-y: auto; flex: 1; padding: 0 8px 16px; display: flex; flex-direction: column; gap: 2px; }
.item { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; padding: 8px 10px; border-radius: 8px; cursor: pointer; border: 1px solid transparent; }
.item:hover { background: var(--raise); }
.item.sel { background: var(--raise); border-color: var(--line); }
.item .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .m { grid-column: 1 / -1; color: var(--mute); font-size: 12px; font-variant-numeric: tabular-nums; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.pill { font-size: 11px; letter-spacing: .04em; text-transform: uppercase; padding: 1px 7px; border-radius: 999px; border: 1px solid currentColor; align-self: center; }
.s-running { color: var(--life); } .s-done { color: var(--ok); } .s-failed { color: var(--err); } .s-stopped { color: var(--warn); }

main { display: grid; grid-template-rows: auto 1fr auto; min-height: 0; min-width: 0; }
header { padding: 14px 20px; border-bottom: 1px solid var(--line); display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
header h1 { font-size: 15px; margin: 0; font-weight: 600; text-wrap: balance; flex: 1 1 260px; }
.facts { display: flex; flex-wrap: wrap; gap: 6px 14px; color: var(--dim); font-size: 12px; font-variant-numeric: tabular-nums; }
.facts code { font-family: var(--mono); color: var(--fg); }

#log { overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
.empty { color: var(--mute); margin: auto; text-align: center; max-width: 44ch; }
.msg { max-width: 78ch; white-space: pre-wrap; word-wrap: break-word; }
.msg.user { align-self: flex-end; background: var(--raise); border: 1px solid var(--line); padding: 10px 14px; border-radius: 12px 12px 2px 12px; }
.msg.assistant { align-self: flex-start; }
.msg.error { color: var(--err); font-family: var(--mono); font-size: 12px; }
.tool { align-self: stretch; font-family: var(--mono); font-size: 12px; border-left: 2px solid var(--life-deep); padding: 2px 0 2px 10px; color: var(--dim); }
.tool summary { cursor: pointer; list-style: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tool summary::-webkit-details-marker { display: none; }
.tool .n { color: var(--life); }
.tool.fail { border-left-color: var(--err); } .tool.fail .n { color: var(--err); }
.tool pre { margin: 6px 0 0; white-space: pre-wrap; max-height: 320px; overflow: auto; background: var(--panel); border: 1px solid var(--line-soft); padding: 8px; border-radius: 6px; color: var(--fg); }

form { border-top: 1px solid var(--line); padding: 12px 20px calc(12px + env(safe-area-inset-bottom, 0px)); display: grid; grid-template-columns: 1fr auto; gap: 8px; background: var(--panel); }
textarea { grid-column: 1 / -1; resize: vertical; min-height: 64px; max-height: 40vh; padding: 10px 12px; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; min-width: 0; }
select { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; max-width: 100%; }
#lane { max-width: min(420px, 100%); font-family: var(--mono); font-size: 12px; }
.acts { display: flex; gap: 8px; }
.btn { padding: 7px 16px; border-radius: 8px; border: 1px solid var(--line); background: var(--raise); cursor: pointer; }
.btn.go { background: var(--life); border-color: var(--life); color: #04201e; font-weight: 600; }
.btn:disabled { opacity: .45; cursor: default; }
#note { grid-column: 1 / -1; font-size: 12px; color: var(--mute); min-height: 1em; }
#note.bad { color: var(--err); }

@media (max-width: 760px) {
  body { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
  aside { border-right: 0; border-bottom: 1px solid var(--line); max-height: 34vh; }
  #log, header, form { padding-inline: 16px; }
}
@media (prefers-reduced-motion: no-preference) { .brand .dot.up { transition: box-shadow .4s; } }
</style>
</head>
<body>
<aside>
  <div class="brand"><span class="dot" id="health" title="server"></span><b>Talon</b><span>sessions</span></div>
  <button class="newbtn" id="new" type="button">+ New session</button>
  <div id="list" role="list"></div>
</aside>
<main>
  <header>
    <h1 id="title">New session</h1>
    <div class="facts" id="facts"></div>
  </header>
  <div id="log" aria-live="polite"><p class="empty">Pick a role and a lane, describe the task, and Talon runs it with the fleet's tools. CLI and dispatcher runs appear on the left too.</p></div>
  <form id="compose">
    <textarea id="prompt" placeholder="Describe the task. Ctrl+Enter to send." aria-label="Prompt"></textarea>
    <div class="row">
      <select id="role" aria-label="Role"></select>
      <select id="lane" aria-label="Model lane"></select>
    </div>
    <div class="acts">
      <button class="btn" id="stop" type="button" disabled>Stop</button>
      <button class="btn go" id="send" type="submit">Run</button>
    </div>
    <div id="note"></div>
  </form>
</main>
<script>
const $ = (id) => document.getElementById(id);
let current = null, lastSeq = 0, polling = null, sessions = [];

async function api(path, body) {
  const r = await fetch(path, body ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) } : {});
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || `HTTP ${r.status}`);
  return j;
}
function note(text, bad) { $("note").textContent = text || ""; $("note").className = bad ? "bad" : ""; }
function ago(t) { const s = Date.now() / 1000 - t; return s < 60 ? "now" : s < 3600 ? `${Math.floor(s / 60)}m` : s < 86400 ? `${Math.floor(s / 3600)}h` : `${Math.floor(s / 86400)}d`; }
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

async function loadPickers() {
  try {
    const [{ roles }, { lanes }] = await Promise.all([api("/api/roles"), api("/api/lanes")]);
    $("role").replaceChildren(...roles.map((r) => new Option(r, r, false, r === "dev")));
    $("lane").replaceChildren(...lanes.map((l) => new Option(l, l)));
    try { const s = localStorage.getItem("talon.lane"); if (s && lanes.includes(s)) $("lane").value = s; } catch (e) {}
    if (!lanes.length) note("No resolvable live lanes: check lane-catalog.db and keys (talon lanes).", true);
  } catch (e) { note(`Server unreachable: ${e.message}`, true); }
}

async function loadList() {
  try {
    ({ sessions } = await api("/api/sessions"));
    $("health").classList.add("up");
    $("list").replaceChildren(...sessions.map((s) => {
      const it = el("div", "item" + (s.id === current ? " sel" : ""));
      it.setAttribute("role", "listitem"); it.tabIndex = 0;
      it.append(el("span", "t", s.title || s.id), el("span", `pill s-${s.status}`, s.status),
        el("span", "m", `${s.role} · ${(s.lane || "").split("/").slice(-1)[0]} · ${s.n_messages} msg · ${ago(s.updated_at)}`));
      it.onclick = it.onkeydown = (ev) => { if (ev.type === "click" || ev.key === "Enter") openSession(s.id); };
      return it;
    }));
  } catch (e) { $("health").classList.remove("up"); }
}

function renderFacts(s) {
  const f = [["role", s.role], ["lane", s.lane], ["tokens", `${s.tokens_in.toLocaleString()} in / ${s.tokens_out.toLocaleString()} out`], ["turns", s.turns]];
  $("facts").replaceChildren(el("span", `pill s-${s.status}`, s.status), ...f.map(([k, v]) => { const sp = el("span", null, `${k} `); sp.append(el("code", null, String(v ?? ""))); return sp; }));
  $("title").textContent = s.title || s.id;
  if ([...$("role").options].some((o) => o.value === s.role)) $("role").value = s.role;
  if ([...$("lane").options].some((o) => o.value === s.lane)) $("lane").value = s.lane;
}

function renderMessages(msgs) {
  const log = $("log");
  if (lastSeq === 0) log.replaceChildren();
  for (const m of msgs) {
    lastSeq = Math.max(lastSeq, m.seq);
    if (m.role === "system") continue;
    if (m.role === "user") log.append(el("div", "msg user", m.content));
    if (m.role === "assistant") {
      if (m.content) log.append(el("div", "msg assistant", m.content));
      for (const tc of m.tool_calls || []) {
        const d = el("details", "tool"); d.dataset.call = tc.id;
        const sum = el("summary"); sum.append(el("span", "n", `→ ${tc.function.name} `), document.createTextNode(tc.function.arguments));
        d.append(sum, el("pre", null, tc.function.arguments)); log.append(d);
      }
    }
    if (m.role === "tool") {
      let ok = true, body = m.content || "";
      try { const j = JSON.parse(body); ok = j.ok !== false && !(j.exit_code > 0); body = JSON.stringify(j, null, 2); } catch (e) {}
      const d = el("details", "tool" + (ok ? "" : " fail"));
      const sum = el("summary"); sum.append(el("span", "n", `← ${m.name} ${ok ? "ok" : "failed"} `), document.createTextNode(body.replace(/\s+/g, " ").slice(0, 160)));
      d.append(sum, el("pre", null, body)); log.append(d);
    }
  }
  log.scrollTop = log.scrollHeight;
}

async function refresh() {
  if (!current) return;
  const { session, messages } = await api(`/api/sessions/${current}?after=${lastSeq}`);
  renderFacts(session); renderMessages(messages);
  const running = session.status === "running" && session.live;
  $("stop").disabled = !running; $("send").disabled = running;
  $("send").textContent = running ? "Running…" : "Send";
  if (session.status === "failed" && session.error && !running) note(session.error, true);
  if (!running && polling) { clearInterval(polling); polling = null; loadList(); }
}

async function openSession(id) {
  current = id; lastSeq = 0; note("");
  try { await refresh(); } catch (e) { note(e.message, true); }
  loadList();
  if (!polling) polling = setInterval(() => refresh().catch(() => {}), 1200);
}

$("new").onclick = () => {
  current = null; lastSeq = 0; if (polling) { clearInterval(polling); polling = null; }
  $("title").textContent = "New session"; $("facts").replaceChildren();
  $("log").replaceChildren(el("p", "empty", "Describe the task below. Talon runs it on the chosen lane with the role's own tools."));
  $("send").textContent = "Run"; $("send").disabled = false; $("stop").disabled = true; note(""); loadList(); $("prompt").focus();
};
$("lane").onchange = () => { try { localStorage.setItem("talon.lane", $("lane").value); } catch (e) {} };
$("prompt").onkeydown = (e) => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) $("compose").requestSubmit(); };
$("stop").onclick = async () => { if (current) { await api(`/api/sessions/${current}/stop`, {}).catch(() => {}); note("Stopping after the current turn…"); } };
$("compose").onsubmit = async (e) => {
  e.preventDefault();
  const prompt = $("prompt").value.trim(); if (!prompt) return;
  note(""); $("send").disabled = true;
  try {
    const body = { prompt, role: $("role").value, lane: $("lane").value };
    const r = current ? await api(`/api/sessions/${current}/messages`, body) : await api("/api/sessions", body);
    $("prompt").value = "";
    if (current === r.id) { if (!polling) polling = setInterval(() => refresh().catch(() => {}), 1200); refresh(); }
    else openSession(r.id);
  } catch (err) { note(err.message, true); $("send").disabled = false; }
};

(async () => {
  await loadPickers(); await loadList();
  if (sessions.length) openSession(sessions[0].id);
  setInterval(loadList, 5000);
})();
</script>
</body>
</html>
